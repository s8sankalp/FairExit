server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # API calls go to the backend container
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        # The backend's per IP rate limit needs the visitor's address, not nginx's
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # nginx's 32 character id; the backend logs it on every line for this request
        proxy_set_header X-Request-Id $request_id;
        proxy_read_timeout 60s;
        client_max_body_size 2m;   # JSON only; files go straight to MinIO
    }

    # Built files have a hash in their name, so they can be cached for a long time
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Single page app: every other path is a React route
    location / {
        try_files $uri /index.html;
    }
}
