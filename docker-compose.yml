services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-fairexit}
      POSTGRES_USER: ${DB_USER:-fairexit}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-fairexit}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-fairexit} -d ${DB_NAME:-fairexit}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: cgr.dev/chainguard/minio:latest
    user: "0:0"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-fairexit}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-fairexit-secret}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    volumes:
      - miniodata:/data

  mailhog:
    image: mailhog/mailhog:latest
    platform: linux/amd64
    ports:
      - "1025:1025"   # SMTP: the app sends here
      - "8025:8025"   # web inbox: open http://localhost:8025 to read every email

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-fairexit}
      DB_USER: ${DB_USER:-fairexit}
      DB_PASSWORD: ${DB_PASSWORD:-fairexit}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # A fixed key so "docker compose up" works on a fresh clone. Local use only:
      # set your own JWT_SECRET in .env (openssl rand -base64 48) for anything else.
      JWT_SECRET: ${JWT_SECRET:-local-development-only-secret-change-me-0123456789}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      RATE_LIMIT_CAPACITY: ${RATE_LIMIT_CAPACITY:-60}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:8081}
      SPRING_MAIL_HOST: mailhog
      SPRING_MAIL_PORT: 1025
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_PUBLIC_ENDPOINT: http://localhost:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-fairexit}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-fairexit-secret}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started   # the app retries until MinIO answers

  frontend:
    build: ./frontend
    ports:
      - "8081:80"     # open http://localhost:8081
    depends_on:
      backend:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - backend

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"        # local only: view dashboards without logging in
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  # Not started by "docker compose up". Run with: docker compose --profile loadtest run --rm k6
  k6:
    image: grafana/k6:latest
    profiles: ["loadtest"]
    environment:
      BASE_URL: http://backend:8080
    volumes:
      - ./load-test:/scripts:ro
    command: run /scripts/audit.js
    depends_on:
      - backend

volumes:
  pgdata:
  miniodata:
