name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:        # run by hand from the Actions tab, also runs the load test

jobs:
  backend:
    runs-on: ubuntu-latest   # has Docker, so Testcontainers tests run here
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      # Runs every test, then the JaCoCo gates: fails below 70% overall or 80% for the audit engine
      - name: Build, test and check coverage
        run: mvn -B verify
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: backend/target/site/jacoco

  load-test:
    if: github.event_name == 'workflow_dispatch'
    needs: backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack
        run: |
          cp .env.example .env
          sed -i "s|^JWT_SECRET=.*|JWT_SECRET=$(openssl rand -base64 48 | tr -d '\n/+=')|" .env
          sed -i "s|^RATE_LIMIT_CAPACITY=.*|RATE_LIMIT_CAPACITY=1000000|" .env
          docker compose up -d --build backend
          for i in $(seq 1 60); do
            curl -fs http://localhost:8080/actuator/health && break
            sleep 5
          done
      # k6 prints p95 per request type; the thresholds fail the job if the audit p95 is 300 ms or more
      - name: k6 load test (100 requests per second for 1 minute)
        run: docker compose --profile loadtest run --rm k6 | tee k6-summary.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k6-summary
          path: k6-summary.txt
      - name: Stop the stack
        if: always()
        run: docker compose down -v
