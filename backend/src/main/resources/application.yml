spring:
  application:
    name: fairexit
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fairexit}
    username: ${DB_USER:fairexit}
    password: ${DB_PASSWORD:fairexit}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # Flyway owns the schema; Hibernate only checks it
  flyway:
    enabled: true
  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}
  task:
    scheduling:
      pool:
        size: 2            # so one slow background job cannot block other timers
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: ${SERVER_PORT:8080}
  # Behind nginx (docker compose), trust X-Forwarded-For from the private Docker network,
  # so the per IP rate limit sees each visitor, not the proxy
  forward-headers-strategy: native

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: fairexit
    distribution:
      percentiles-histogram:
        http.server.requests: true   # lets Grafana compute p95 per endpoint
  health:
    mail:
      enabled: false   # a mail outage delays reminders; it must not mark the whole app DOWN

logging:
  pattern:
    level: "%5p [%X{requestId:-}]"

fairexit:
  jwt:
    secret: ${JWT_SECRET:}     # required, at least 32 bytes; the app refuses to start without it
    access-ttl: 15m
    refresh-ttl: 7d
  rate-limit:
    capacity: ${RATE_LIMIT_CAPACITY:60}   # raised only for load tests, to measure the app, not the limiter
    period: 1m
  jobs:
    worker-enabled: true
    poll-interval-ms: 1000
    max-attempts: 3            # first try plus 2 retries
    retry-backoff: 5s          # then 20s
    stale-after: 2m
  llm:
    api-key: ${GEMINI_API_KEY:}        # optional: without it, bills are entered by hand
    model: ${GEMINI_MODEL:gemini-3.8-flash}
    timeout: 20s
    daily-limit: 20
    cache-ttl: 30d
  storage:
    endpoint: ${STORAGE_ENDPOINT:http://localhost:9000}               # how the app reaches MinIO
    public-endpoint: ${STORAGE_PUBLIC_ENDPOINT:http://localhost:9000} # how the browser reaches it
    access-key: ${MINIO_ROOT_USER:fairexit}
    secret-key: ${MINIO_ROOT_PASSWORD:fairexit-secret}
    bucket: fairexit-vault
    url-ttl: 10m
    max-upload-bytes: 10485760
  prices:
    nightly-refresh-enabled: true
    refresh-cron: "0 30 2 * * *"     # 02:30 India time
  admin:
    emails: ${ADMIN_EMAILS:}           # comma separated; these accounts can import prices
  reminders:
    worker-enabled: true
    poll-interval-ms: 30000
    send-hour: 9                  # reminders go out at 09:00 India time
    default-refund-days: 30       # used when the agreement does not say
  mail:
    from: FairExit <reminders@fairexit.local>
  cors:
    # Browser origins allowed to call the API directly. The bundled frontend calls it through
    # its own nginx (same origin), so this is for development setups that call port 8080.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8081}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
